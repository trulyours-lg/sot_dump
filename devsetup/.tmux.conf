# ~/.tmux.conf  — vm-trulyours dev session
# Reload after editing:  tmux source-file ~/.tmux.conf

# ---------- core ----------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"     # truecolor
set -g history-limit 50000
set -g escape-time 10                          # no delay on ESC (nvim)
set -g focus-events on
set -g base-index 1                            # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------- clipboard ----------
# OSC 52: lets tmux push yanked text to YOUR terminal's clipboard over SSH,
# bypassing the VM clipboard channel entirely. Works in most modern terminals.
set -g set-clipboard on

# ---------- mouse ----------
set -g mouse on
# drag to select + copy, release to yank without jumping to bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# ---------- copy mode (vi keys) ----------
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind p paste-buffer

# ---------- splits: intuitive keys, inherit cwd ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---------- pane navigation: prefix-free with Alt ----------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# vi-style with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------- pane resize: repeatable ----------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r Space next-layout
bind z resize-pane -Z                           # zoom toggle

# ---------- window nav ----------
bind -n S-Left  previous-window
bind -n S-Right next-window
bind Tab last-window

# ---------- quality of life ----------
bind r source-file ~/.tmux.conf \; display "config reloaded"
bind x kill-pane                                 # no confirm prompt
bind X kill-window
set -g detach-on-destroy off                     # don't drop SSH when last window closes

# ---------- status bar ----------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bg=colour24,fg=colour255,bold] #S #[default] "
set -g status-right "#[fg=colour244]#(hostname) #[fg=colour250]| %H:%M "
setw -g window-status-current-style "bg=colour24,fg=colour255,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=colour24"
set -g pane-border-style "fg=colour238"

# ---------- activity ----------
setw -g monitor-activity on
set -g visual-activity off
